<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fernfall Inventory & Crafting Demo</title><link rel="stylesheet" href="inventory.css"><link rel="stylesheet" href="crafting.css"><style>body{background:radial-gradient(circle at 60% 30%,#526b45,#1d3228 65%,#102019);color:#fff0ce;text-align:center;font-family:Georgia,serif;min-height:100vh}h1{padding-top:30px}button.demo{background:#dbc89c;border:3px solid #6a4e35;padding:12px 22px;margin:7px;border-radius:4px;cursor:pointer}.demo-stage{height:390px;display:grid;place-items:center}.demo-stage canvas{border:6px ridge #896343;image-rendering:pixelated;background:#607b50}</style></head><body><h1>✳ Fernfall — Inventory & Crafting</h1><p>Press <b>I</b> for inventory, <b>C</b> for crafting, and <b>1–9</b> for the hotbar.</p><button class="demo" onclick="FernfallInventory.open()">Open inventory</button><button class="demo" onclick="FernfallCrafting.open()">Open crafting</button><button class="demo" onclick="sample()">Add demo supplies</button><div class="demo-stage"><canvas id="preview" width="420" height="250"></canvas></div><label for="act">Preview tool use:</label> <select id="act"><option value="mine">Pickaxe mining</option><option value="chop">Axe chopping</option><option value="dig">Shovel digging</option><option value="till">Hoe tilling</option><option value="attack">Sword attack</option><option value="shoot">Bow</option><option value="fish">Fishing rod</option><option value="shear">Shears</option></select><script src="item-catalog.js"></script><script src="inventory.js"></script><script src="crafting.js"></script><script src="tool-animations.js"></script><script>function sample(){for(const id of ['wood','stone','stick','iron','carrot','potato','beef_raw','berries','stone_pickaxe','stone_axe','campfire'])FernfallInventory.add(id,16)}const c=document.getElementById('preview'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;function draw(t){ctx.clearRect(0,0,420,250);ctx.fillStyle='#718e5a';ctx.fillRect(0,0,420,250);for(let x=0;x<420;x+=28)for(let y=0;y<250;y+=28){ctx.fillStyle=((x+y)/28)%3===0?'#7b995f':'#78925d';ctx.fillRect(x+4,y+13,7,3)}FernfallToolAnimations.draw(ctx,document.getElementById('act').value,'down',160,55,96,t);requestAnimationFrame(draw)}requestAnimationFrame(draw)</script></body></html>
